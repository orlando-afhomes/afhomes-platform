# AFHomes pilot schema (localhost Step A): sign-in identities, sales network,
# customer, contract, receipt, audit, idempotency and official-number sequences.
#
# Conventions
# - Every table has an internal UUID `id`. Official numbers (customer number, VIP
#   Number, receipt reference and document number) are separate unique columns.
# - Money is whole centavos in Int64 (`*Centavos`). Int64 travels as a string, so
#   it stays exact end to end. Never use Float for money.
# - Business dates (`Date`) are Asia/Manila calendar days. Action times
#   (`Timestamp`) are real instants and are kept separately.
# - shortcut: lifecycle values (status, role, purpose, method) are plain strings
#   validated in the server services. Move them to database enums or check
#   constraints once the pilot rules settle.
# - shortcut: nested snapshots (benefits, schedule, genealogy, history,
#   adjustments) live in a jsonb `details` column. Normalize a part into its own
#   table when a report or rule has to query inside it.
# - Every operation is marked @auth(level: NO_ACCESS) in the connector, so only
#   the trusted server (Firebase Admin SDK) can call it.

type UserAccount @table {
  # Linked to the Firebase user at first sign-in (Step B). Null until then.
  firebaseUid: String @unique
  email: String! @unique
  displayName: String!
  # active | pending | suspended | deactivated
  status: String!
  # admin | staff | sales (which sign-in page the account uses)
  portal: String!
  # Sales-network members sign in too. Staff-only accounts have no member.
  member: Member
  # Office employee linked to this account. Department-role module grants come through this link.
  staff: StaffMember
  # Who requested the account; lets activation record a self-approval note when the requester approves it.
  createdBy: UserAccount
  createdAt: Timestamp! @default(expr: "request.time")
}

type Department @table {
  name: String!
  code: String! @unique
  description: String!
  # Internal staff id of the head; no foreign key so department/staff can be seeded in any order.
  headStaffId: String
  # active | deactivated
  status: String!
}

type DepartmentRole @table {
  name: String!
  department: Department!
  # Delegable module grants, stored as a string array in jsonb.
  moduleIds: Any
  # active | deactivated
  status: String!
  # Protected Super Admin role: only a Super Administrator may assign or change it.
  isProtected: Boolean!
  createdAt: Timestamp! @default(expr: "request.time")
}

type StaffMember @table {
  displayName: String!
  position: String!
  department: Department
  departmentRole: DepartmentRole
  # active | inactive | suspended
  status: String!
  email: String! @unique
  createdAt: Timestamp! @default(expr: "request.time")
  # Person-profile fields (prefix, names, contact, address, government ID).
  profile: Any
}

type AccountStatusEvent @table {
  account: UserAccount!
  previousStatus: String
  newStatus: String!
  reason: String
  actor: UserAccount
  occurredAt: Timestamp! @default(expr: "request.time")
}

type RoleAssignment @table(key: ["user", "role"]) {
  user: UserAccount!
  # super_admin | admin | finance | hr | clerk | gsd | svd | ssm | sm | ost
  role: String!
  # active | inactive
  status: String!
}

type Member @table {
  displayName: String!
  # SVD | SSM | SM | OST
  designation: String!
  branchId: String!
  # Sponsor or parent in the genealogy. Null only for a root (SVD).
  parent: Member
  status: String!
  teamName: String
  referralCode: String
  aaNumber: String
  details: Any
  # Append-only create/transfer/status history for this member (doc 02 section 6).
  parentHistory: Any
  # Bumped by every hierarchy write; a guarded transfer commits only against the row version it read.
  rowVersion: Int! @default(value: 0)
}

type Customer @table {
  displayName: String!
  branchId: String!
  # Closing seller who owns the record.
  ownerMember: Member
  status: String!
  # Official Customer ID, YYYY-NNNN. Null while the record is a draft.
  customerNumber: String @unique
  profile: Any
  # Normalized identity keys for duplicate checks (doc 04 section 14); never displayed.
  normalizedEmail: String
  normalizedMobile: String
  # first|last, lowercase, for an indexed name + birth-date duplicate query.
  normalizedName: String
  dateOfBirth: Date
}

type Contract @table {
  customer: Customer!
  productCode: String!
  priceCentavos: Int64!
  classification: String!
  status: String!
  # Reservation Agreement reference from the signed form.
  raNumber: String
  # Official VIP Number, issued once and never reused.
  vipNumber: String @unique
  signedAgreementRecordedDate: Date
  sellerMember: Member
  createdAt: Timestamp!
  # Bumped by every receipt decision on this contract. A decision commits only if the
  # version it read is still current, so two approvals never act on stale totals.
  collectionVersion: Int! @default(value: 0)
  details: Any
}

# One sale per contract, created when the contract is submitted (doc 13).
type Sale @table {
  contract: Contract! @unique
  customer: Customer!
  productCode: String!
  branchId: String!
  valueCentavos: Int64!
  recordedDate: Date!
  sellerMember: Member
  referrerMember: Member
  # pending | confirmed | defaulted | cancelled | rejected
  status: String!
  approvedBy: UserAccount
  approvedAt: Timestamp
  confirmedDate: Date
  # Interim contract-level financial hold (doc 07 section 19); memberships take it over in F7.
  financialHold: Boolean! @default(value: false)
  details: Any
}

# Append-only ledger of verified-payment reversals and refunds (doc 07 section 14).
type PaymentAdjustment @table {
  payment: Payment!
  # reversal | refund
  kind: String!
  amountCentavos: Int64!
  date: Date!
  reason: String!
  actor: UserAccount
  createdAt: Timestamp! @default(expr: "request.time")
}

# A month whose totals were frozen; receipts dated in it are counted in the first open month.
type ClosedMonth @table {
  month: String! @unique
  closedAt: Timestamp!
  closedBy: UserAccount
  snapshot: Any
}

# Receipt with no matching contract; waits in the Finance exceptions queue (doc 07 section 11).
type UnmatchedReceipt @table {
  amountCentavos: Int64!
  method: String!
  paidDate: Date!
  orNumber: String!
  reason: String!
  evidenceFileName: String
  # unmatched | matched | rejected
  status: String!
  matchedPayment: Payment
  submittedBy: UserAccount
  submittedAt: Timestamp!
  decidedBy: UserAccount
  decidedAt: Timestamp
  decisionReason: String
  details: Any
}

# Historical receipt import batch (doc 07 section 20); counts only after Administrator sign-off.
type ReceiptImportBatch @table {
  fileName: String!
  createdBy: UserAccount
  # pending_signoff | signed_off | rejected
  status: String!
  totalRows: Int!
  receipts: Any
  skipped: Any
  decidedBy: UserAccount
  decidedAt: Timestamp
  decisionReason: String
  details: Any
  createdAt: Timestamp! @default(expr: "request.time")
}

# Append-only dated ledger of a sale's confirmation, reversal and reconfirmation.
type SaleAdjustment @table {
  sale: Sale!
  date: Date!
  amountCentavos: Int64!
  # confirmation | reversal | reconfirmation | amendment
  kind: String!
  reason: String!
  actor: UserAccount
  createdAt: Timestamp! @default(expr: "request.time")
}

type Payment @table {
  contract: Contract!
  customer: Customer!
  # reservation | down_payment | installment | full
  purpose: String!
  amountCentavos: Int64!
  method: String!
  # Business date on the receipt.
  paidDate: Date!
  # Accounting date for a receipt admitted after its own month closed.
  countedDate: Date
  # System payment reference, PAY-YYYYMMDD-NNNN.
  referenceNo: String @unique
  # Number printed on the issued document (OR, invoice, collection receipt).
  documentNo: String @unique
  # submitted | under_review | verified | rejected | returned
  status: String!
  submittedBy: UserAccount
  submittedAt: Timestamp!
  verifiedBy: UserAccount
  verifiedAt: Timestamp
  # Business date of Finance verification. Collections are dated by this.
  verifiedDate: Date
  decisionReason: String
  details: Any
}

# Append-only. The connector exposes insert operations only, never update or delete.
type AuditEvent @table {
  actor: UserAccount
  action: String!
  entityType: String!
  # Internal id of the affected record (polymorphic, so not a foreign key).
  entityId: String!
  occurredAt: Timestamp! @default(expr: "request.time")
  correlationId: String
  details: Any
}

type IdempotencyRecord @table(key: ["user", "operation", "requestKey"]) {
  user: UserAccount!
  operation: String!
  requestKey: String!
  requestHash: String!
  responseStatus: Int!
  response: Any
  createdAt: Timestamp! @default(expr: "request.time")
}

# ---------------------------------------------------------------- confirmed reference data
# Configuration the business rules already settle. It is not sample data: the clean seed
# loads it, and contracts and forms read it from here (doc 05 sections 3 to 8).

type TierLevel @table {
  # Stable sample/import key, e.g. tier-level-bronze. Products resolve their level through this.
  key: String! @unique
  name: String!
  # bronze | silver | gold | neutral
  colorKey: String!
  sortOrder: Int!
  # active | inactive. A level used by a product is deactivated, never deleted.
  status: String!
  # Bumped by every configuration change; finalized contracts keep their own snapshot.
  configVersion: Int! @default(value: 1)
  effectiveDate: Date
  changes: Any
}

type Product @table {
  # Exactly two characters, one uppercase letter and one digit (doc 05 section 4.1).
  code: String! @unique
  name: String!
  tierLevel: TierLevel!
  # Whole centavos. Int64 travels as a string.
  priceCentavos: Int64!
  # contract_stated | conflict
  priceStatus: String!
  priceNote: String
  validityYears: Int!
  earningCycles: Int!
  vipDiscountPercent: Int!
  lifetimePoints: Int!
  pointsPerCycle: Int!
  weekdayPointsPerCycle: Int!
  weekendPointsPerCycle: Int!
  minSpendPerCycleCentavos: Int64!
  supplementaryHolders: Int!
  description: String
  benefitsSummary: String
  imageUrl: String
  imageFileName: String
  # active | retired
  status: String!
  # draft | approved
  approvalStatus: String!
  publiclyListed: Boolean!
  configVersion: Int!
  effectiveDate: Date
  changes: Any
}

type Experience @table {
  # Stable screen key, e.g. exp-1.
  key: String! @unique
  slug: String! @unique
  title: String!
  category: String!
  summary: String!
  status: String!
  # progress | upcoming | live
  statusTone: String!
  # Public image object (url, alt, width and height fields as the site needs them).
  image: Any
  overview: String!
  highlights: Any
  standard: Boolean!
  published: Boolean!
  createdAt: String!
  updatedAt: String!
}

type Outlet @table {
  key: String! @unique
  name: String!
  # accommodation | restaurant | spa | shop | other
  type: String!
  # active | inactive
  status: String!
  # Marked sample until the owner supplies the real outlet.
  sample: Boolean!
}

type ReferenceEntry @table {
  key: String! @unique
  # program-category | gov-id-type | bank
  list: String!
  # Stable value stored on records; never changes after creation.
  value: String!
  label: String!
  # active | inactive
  status: String!
  sortOrder: Int!
}

type PrintTemplate @table {
  # application | reservation-<tier> | grant-<tier> | vip-card
  key: String! @unique
  name: String!
  # application | reservation | grant | card
  kind: String!
  # The supplied form's revision label.
  revision: String!
  # Supplied PDF asset path; null for a design rendered by the app.
  assetPath: String
  status: String!
  sortOrder: Int!
}

type PaymentScheme @table {
  # Stable key the screens use, e.g. scheme-spot-cash.
  key: String! @unique
  label: String!
  historicalLabel: String
  # cash | installment | move
  category: String!
  paymentCode: String
  paymentCodeByTier: Any
  applicableTiers: Any
  reservationCentavos: Int64
  installmentCount: Int
  # Centavos per tier stay safe-integer numbers inside jsonb.
  installmentCentavosByTier: Any
  priceCentavosByTier: Any
  installmentCountByTier: Any
  downPaymentBasisPoints: Int
  # configured | pending_owner_decision
  commercialStatus: String!
  source: String!
  # available | unavailable
  availability: String!
  ownerHold: String
  configVersion: Int!
  effectiveDate: Date
  changes: Any
  sortOrder: Int!
}

# ---------------------------------------------------------------- F2: accreditation and network
type Accreditation @table {
  member: Member!
  # IST | OST
  classification: String!
  # pending | active | suspended | revoked | cancelled
  adminStatus: String!
  originalAccreditationDate: Date
  effectiveDate: Date
  expiryDate: Date
  # Current number. Every issued number is also in AccreditationNumber, which is unique.
  aaNumber: String @unique
  suspensionEffectiveDate: Date
  endDate: Date
  # Append-only history entries (operation, values, actor, time).
  history: Any
  createdAt: Timestamp! @default(expr: "request.time")
}

# One row per issued AA number. The unique column is the never-reuse guarantee
# and the allocation lock; renewal marks the old row replacedOn.
type AccreditationNumber @table {
  aaNumber: String! @unique
  member: Member!
  accreditation: Accreditation!
  # YYMM the number belongs to.
  month: String!
  sequence: Int!
  issuedOn: Date!
  replacedOn: Date
  createdAt: Timestamp! @default(expr: "request.time")
}

type RegistrationApplication @table {
  # OST (only OST applications are submitted publicly in this phase).
  classification: String!
  member: Member
  account: UserAccount
  sponsorMember: Member
  # draft | submitted | pending_review | needs_info | approved | rejected | withdrawn
  status: String!
  # Sponsor name and designation as submitted, for the office queue.
  sponsorLabel: String!
  reference: String! @unique
  applicant: Any
  version: Int! @default(value: 1)
  versions: Any
  completion: Any
  # Private correction link token; set only while the application is returned.
  correctionToken: String @unique
  decisionReason: String
  history: Any
  reviewer: UserAccount
  submittedAt: Timestamp
  decidedAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# Effective-dated vacant leader seat (doc 02 section 5.1.1). The team stays in place.
type SeatVacancy @table {
  seatMember: Member!
  holderEndDate: Date!
  startDate: Date!
  filledOn: Date
  # promotion | transfer
  filledMethod: String
  filledByMember: Member
  recordedBy: UserAccount
  recordedAt: Timestamp! @default(expr: "request.time")
}

# ---------------------------------------------------------------- F3: customer imports
type CustomerImportJob @table {
  fileName: String!
  actor: UserAccount
  totalRows: Int!
  createdCount: Int!
  needsReviewCount: Int!
  invalidCount: Int!
  # Internal ids of the drafts created by this job.
  createdCustomerIds: Any
  createdAt: Timestamp! @default(expr: "request.time")
}

# Diagnostics only: no applicant fields are copied here.
type CustomerImportRow @table {
  job: CustomerImportJob!
  rowNumber: Int!
  # ready | needs_review | invalid
  status: String!
  errors: Any
  warnings: Any
}

# ---------------------------------------------------------------- F4: property sales (IGP)
# Admin-managed project list; sale copies of the names stay on the sale.
type IgpProject @table {
  name: String! @unique
  location: String
  # active | inactive
  status: String!
  createdAt: Timestamp! @default(expr: "request.time")
}

type IgpUnit @table {
  project: IgpProject!
  unitOrLot: String!
  propertyOwner: String!
  # active | inactive
  status: String!
  createdAt: Timestamp! @default(expr: "request.time")
}

# One property sale (IGP). The Series Number is unique and never reused; receipts live in
# `details` until F5 unifies them with the VIP receipt table (recorded shortcut).
type IgpSale @table {
  customer: Customer!
  project: IgpProject
  unit: IgpUnit
  priceCentavos: Int64!
  # C | T
  scheme: String!
  termMonths: Int!
  # S | N
  clauses: String!
  date: Date!
  sellerMember: Member!
  referrerMember: Member
  seriesNumber: String! @unique
  sequence: Int!
  # pending | approved | defaulted | cancelled | replaced | pending_review
  status: String!
  createdBy: UserAccount
  approvedBy: UserAccount
  details: Any
}

type IgpAccreditation @table {
  member: Member!
  number: String! @unique
  approvedDate: Date!
  validUntil: Date!
  replaces: String
}

# Singleton settings row (key "igp"): collection threshold and grant card-level minimums.
type IgpSettings @table {
  key: String! @unique
  thresholdBp: Int!
  grantTierRules: Any
}

# IGP buyer membership: created when the Formal VIP Grant is first signed. No Stay Points, no VIP Number.
type IgpBuyerMembership @table {
  sale: IgpSale!
  seriesNumber: String!
  customer: Customer!
  tier: String
  grantSignedDate: Date!
  status: String!
  stayPoints: String!
}

# Imported IGP history kept for reference; its Series Numbers are reserved and never reused.
type IgpHistoryBatch @table {
  fileName: String!
  createdBy: UserAccount
  totalRows: Int!
  rows: Any
  skipped: Any
  createdAt: Timestamp! @default(expr: "request.time")
}
